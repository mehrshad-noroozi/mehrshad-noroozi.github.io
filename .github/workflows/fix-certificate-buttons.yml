name: Normalize certificate button styles
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore certificate buttons to base ghost style
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('style.css')
          s = p.read_text(encoding='utf-8')
          marker = '\n.course-list>div:not(.license)>.btn.ghost{'
          i = s.find(marker)
          if i != -1:
              s = s[:i].rstrip() + '\n'
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css .github/workflows/fix-certificate-buttons.yml
          git commit -m 'Restore certificate buttons to original style' || exit 0
          git rm .github/workflows/fix-certificate-buttons.yml
          git commit -m 'Remove temporary certificate fix workflow'
          git push