name: Generate portfolio PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Generate PDF from current site
        run: |
          cat > generate-pdf.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({
            viewport: { width: 1440, height: 1000 },
            deviceScaleFactor: 1
          });

          await page.goto('https://mehrshad-noroozi.github.io/', { waitUntil: 'networkidle', timeout: 120000 });
          await page.evaluate(() => {
            document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
            window.scrollTo(0, 0);
          });
          await page.waitForTimeout(1500);
          await page.pdf({
            path: 'mehrshad-noroozi-portfolio.pdf',
            format: 'A4',
            printBackground: true,
            preferCSSPageSize: false,
            margin: { top: '0', right: '0', bottom: '0', left: '0' }
          });
          await browser.close();
          EOF
          node generate-pdf.mjs

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: mehrshad-noroozi-portfolio-pdf
          path: mehrshad-noroozi-portfolio.pdf
          retention-days: 30
